<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Политология — защита тем 1–2</title>
<meta name="description" content="Аппарат политической науки, проверенный на казахстанском кейсе 2026 года. Защита за 13 минут.">
<meta name="theme-color" content="#F7F4EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC; --paper:#FFFFFF; --ink:#14161A; --dim:#5F646C; --line:rgba(20,22,26,.11);
  --sky:#0E9EC4; --skyT:#0A7F9E; --gold:#E9A825; --goldT:#A86E06; --navy:#1C2B4B;
  --disp:'Unbounded',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --pad:clamp(20px,5vw,84px);
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 1px 2px rgba(20,22,26,.04),0 10px 22px -16px rgba(20,22,26,.26);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--body);-webkit-font-smoothing:antialiased}
body.is-remote{overflow:auto}
::selection{background:var(--gold);color:#14161A}
button{font-family:inherit}

/* ---------- ambient: бумага, сетка, мягкие пятна ---------- */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#amb .blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform;
  transition:transform 1.6s var(--ease)}
#amb .b1{width:80vw;height:80vw;background:radial-gradient(circle,rgba(14,158,196,.34) 0%,rgba(14,158,196,.12) 35%,transparent 68%);top:-34vw;right:-26vw}
#amb .b2{width:70vw;height:70vw;background:radial-gradient(circle,rgba(233,168,37,.30) 0%,rgba(233,168,37,.10) 35%,transparent 68%);bottom:-32vw;left:-24vw}
#gridbg{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:radial-gradient(rgba(20,22,26,.16) 1px,transparent 1.2px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(90% 80% at 50% 50%,#000 30%,transparent 100%);
  mask-image:radial-gradient(90% 80% at 50% 50%,#000 30%,transparent 100%);opacity:.55}

/* ---------- deck ---------- */
#deck{position:fixed;inset:0;z-index:2}
.slide{position:absolute;inset:0;display:none;padding:calc(var(--pad) + 30px) var(--pad) calc(var(--pad) + 58px);
  overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.on{display:flex}
.slide-in{animation:sIn .7s var(--ease) both}
.slide-out{animation:sOut .32s var(--ease) both;pointer-events:none}
@keyframes sIn{from{opacity:0;transform:translate3d(0,var(--dy,44px),0) scale(.985)}
  to{opacity:1;transform:none}}
@keyframes sOut{from{opacity:1}to{opacity:0;transform:translate3d(0,calc(var(--dy,44px) * -.45),0)}}
.wrap{width:100%;max-width:1240px;margin:auto;display:flex;flex-direction:column;justify-content:center;min-height:100%;position:relative}

[data-r]{opacity:0;transform:translateY(22px)}
.on [data-r]{animation:rv .78s var(--ease) forwards;animation-delay:calc(var(--i,0) * 85ms + 150ms)}
@keyframes rv{to{opacity:1;transform:none}}

/* ---------- typography ---------- */
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--skyT);
  display:flex;align-items:center;gap:12px;margin:0 0 18px;flex-wrap:wrap}
.kicker::before{content:"";width:26px;height:2px;background:var(--sky)}
.kicker .sp{color:var(--dim)}
h1.t{font-family:var(--disp);font-weight:800;font-size:clamp(29px,5.2vw,72px);line-height:.99;letter-spacing:-.03em;margin:0 0 22px;color:var(--ink)}
h2.t{font-family:var(--disp);font-weight:600;font-size:clamp(24px,3.6vw,50px);line-height:1.05;letter-spacing:-.025em;margin:0 0 20px}
.lede{font-size:clamp(16px,1.5vw,22px);line-height:1.55;color:#2C3038;max-width:80ch;margin:0 0 18px;font-weight:300}
.lede b{font-weight:600;color:var(--ink)}
.sm{font-size:clamp(13.5px,1.1vw,16px);line-height:1.62;color:var(--dim);font-weight:300}
.hl{color:var(--skyT)} .hlg{color:var(--goldT)} .mono{font-family:var(--mono)}
mark{background:linear-gradient(transparent 55%,rgba(233,168,37,.45) 0);color:inherit;padding:0 2px}
.mt{margin-top:18px}

/* ---------- blocks ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.7vw,22px);
  box-shadow:var(--shadow);transition:transform .45s var(--ease),border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-4px);border-color:rgba(14,158,196,.55);box-shadow:0 2px 4px rgba(20,22,26,.05),0 22px 40px -22px rgba(14,158,196,.45)}
.card h3{font-family:var(--disp);font-weight:600;font-size:clamp(15px,1.3vw,19px);margin:0 0 8px;letter-spacing:-.01em}
.card p{margin:0;font-size:clamp(13px,1.02vw,15.5px);line-height:1.55;color:#3D424A;font-weight:300}
.card p + p{margin-top:8px}
.card p b{color:var(--ink);font-weight:600}
.card .n{font-family:var(--mono);font-size:11px;color:var(--skyT);letter-spacing:.14em;display:block;margin-bottom:9px}
.card.acc{border-color:rgba(14,158,196,.4);background:linear-gradient(160deg,rgba(14,158,196,.12),rgba(14,158,196,.03)),#fff}
.card.gold{border-color:rgba(233,168,37,.5);background:linear-gradient(160deg,rgba(233,168,37,.16),rgba(233,168,37,.04)),#fff}
.card.gold .n{color:var(--goldT)}
.card.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.card.navy h3{color:#fff} .card.navy p{color:rgba(255,255,255,.78)} .card.navy p b{color:#fff}
.card.navy .n{color:var(--gold)}

.pos{border-left:4px solid var(--gold);padding:clamp(14px,1.6vw,20px) clamp(16px,2vw,26px);
  background:linear-gradient(90deg,rgba(233,168,37,.16),rgba(233,168,37,0) 80%);border-radius:0 14px 14px 0;margin:6px 0 16px}
.pos p{margin:0;font-family:var(--disp);font-weight:600;font-size:clamp(17px,2vw,28px);line-height:1.26;letter-spacing:-.02em}

.ask{display:flex;gap:14px;align-items:flex-start;border:1px dashed rgba(14,158,196,.6);border-radius:14px;
  padding:clamp(13px,1.5vw,18px);background:rgba(14,158,196,.07)}
.ask .ic{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--skyT);line-height:1}
.ask p{margin:0;font-size:clamp(14px,1.15vw,17px);line-height:1.5;color:#2C3038}
.ask p b{color:var(--ink)}

.srcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.src{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;
  color:var(--goldT);border:1px solid rgba(233,168,37,.55);border-radius:999px;padding:5px 11px;background:rgba(233,168,37,.12)}

.list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px}
.list li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(14px,1.15vw,17px);line-height:1.5;color:#2C3038;font-weight:300}
.list li b{font-weight:600;color:var(--ink)}
.list .bul{flex:0 0 auto;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--skyT);background:rgba(14,158,196,.12);
  border:1px solid rgba(14,158,196,.35);margin-top:2px}

.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--sky),var(--gold),transparent)}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-24px;top:7px;width:10px;height:10px;border-radius:50%;
  background:var(--sky);box-shadow:0 0 0 4px rgba(14,158,196,.18)}
.tl .d{font-family:var(--mono);font-size:12px;color:var(--skyT);letter-spacing:.1em}
.tl .h{font-family:var(--disp);font-weight:600;font-size:clamp(15px,1.45vw,21px);margin:4px 0 3px}
.tl .s{font-size:14px;color:var(--dim);font-weight:300}
.tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;margin-top:7px;color:var(--dim);background:#fff}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:14px}
.stat .v{white-space:nowrap;font-family:var(--disp);font-weight:800;font-size:clamp(30px,4.2vw,58px);line-height:1;letter-spacing:-.045em;color:var(--skyT)}
.stat .v small{font-size:.4em;letter-spacing:0}
.stat .k{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.4}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:clamp(84px,10vw,132px) 1fr auto;gap:14px;align-items:center}
.bar .nm{font-weight:600;font-size:clamp(13px,1.05vw,16px)}
.bar .tr{height:22px;border-radius:7px;background:rgba(20,22,26,.07);overflow:hidden}
.bar .fl{display:block;height:100%;width:0;border-radius:7px;background:var(--c,linear-gradient(90deg,var(--sky),#3BC1E0));
  transition:width 1.1s var(--ease);transition-delay:calc(var(--i,0) * 90ms + 240ms)}
.on .bar .fl{width:var(--w)}
.bar .pc{font-family:var(--mono);font-size:13px;color:var(--dim);min-width:96px;text-align:right}
.bar .pc b{color:var(--ink)}

/* полукруг парламента */
.hemi{width:100%;max-width:560px;margin:0 auto;display:block}
.hemi circle{opacity:0;transform:scale(.2);transform-origin:center;transform-box:fill-box;
  transition:opacity .45s var(--ease),transform .55s var(--ease)}
.on .hemi circle{opacity:1;transform:scale(1)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:13px;color:#2C3038}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:-1px}

.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dim{border-radius:18px;padding:clamp(15px,1.8vw,24px);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);
  transition:transform .5s var(--ease)}
.dim:hover{transform:translateY(-6px)}
.dim .w{font-family:var(--disp);font-weight:800;font-size:clamp(20px,2.5vw,34px);letter-spacing:-.03em;margin-bottom:6px}
.dim .q{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
.dim p{margin:0;font-size:clamp(13px,1.02vw,15.5px);line-height:1.55;color:#3D424A;font-weight:300}
.dim p b{color:var(--ink);font-weight:600}
.dim.a{border-top:5px solid var(--sky)} .dim.a .w{color:var(--skyT)}
.dim.b{border-top:5px solid var(--gold)} .dim.b .w{color:var(--goldT)}
.dim.c{border-top:5px solid var(--navy)} .dim.c .w{color:var(--navy)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,48px);align-items:center}
.quote{font-family:var(--disp);font-weight:400;font-size:clamp(17px,2vw,28px);line-height:1.3;letter-spacing:-.02em}
.quote b{font-weight:600}
.quote .who{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--dim);margin-top:14px;text-transform:uppercase}

/* разделитель блока */
.chap .wrap{align-items:flex-start}
.chap .big{font-family:var(--disp);font-weight:800;font-size:clamp(50px,12.5vw,182px);line-height:.84;letter-spacing:-.055em;
  background:linear-gradient(100deg,var(--ink) 25%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.chap .meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;color:var(--dim);background:#fff}
.pill.a{border-color:rgba(14,158,196,.5);color:var(--skyT);background:rgba(14,158,196,.08)}
.pill.g{border-color:rgba(233,168,37,.55);color:var(--goldT);background:rgba(233,168,37,.12)}

/* обложка + печать */
.cover .eyebrow{font-family:var(--mono);font-size:clamp(10px,1vw,13px);letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.cover h1{font-family:var(--disp);font-weight:800;font-size:clamp(36px,8.4vw,122px);line-height:.9;letter-spacing:-.05em;margin:18px 0 0}
.cover h1 .l2{display:block;background:linear-gradient(96deg,var(--sky),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .sub{margin-top:24px;font-size:clamp(15px,1.45vw,21px);color:#2C3038;max-width:60ch;font-weight:300;line-height:1.5}
.cover .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.cover .cta{margin-top:32px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.key{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border:1px solid var(--line);
  border-radius:7px;font-family:var(--mono);font-size:11px;color:var(--ink);background:#fff;box-shadow:0 1px 0 rgba(20,22,26,.08)}
.seal{position:absolute;right:0;top:50%;width:clamp(180px,22vw,320px);height:auto;transform:translateY(-50%);
  animation:spin 46s linear infinite;opacity:.9;pointer-events:none}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}
.seal text{font-family:var(--mono);font-size:13.5px;letter-spacing:.32em;text-transform:uppercase;fill:var(--skyT)}
.seal .ring{fill:none;stroke:var(--sky);stroke-width:1.2;opacity:.55}
.seal .star{fill:var(--gold)}

/* ---------- chrome ---------- */
#top{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(20,22,26,.08);z-index:40}
#top i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--gold));transition:width .5s var(--ease)}
#hud{position:fixed;top:15px;left:var(--pad);right:var(--pad);z-index:41;display:flex;justify-content:space-between;
  align-items:center;gap:12px;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
#hud b{color:var(--ink);font-weight:600}
#hud .r{display:flex;gap:8px;align-items:center;pointer-events:auto}
.btn{pointer-events:auto;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--dim);
  border-radius:9px;padding:6px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  transition:.25s;box-shadow:0 1px 0 rgba(20,22,26,.06)}
.btn:hover{color:var(--skyT);border-color:rgba(14,158,196,.6);background:#fff}
#nav{position:fixed;bottom:18px;right:var(--pad);z-index:41;display:flex;gap:8px}
#nav button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:16px;padding:0;color:var(--ink)}
#dots{position:fixed;bottom:26px;left:var(--pad);z-index:41;display:flex;gap:5px;align-items:center;max-width:55vw;flex-wrap:wrap}
#dots i{display:block;width:15px;height:3px;border-radius:2px;background:rgba(20,22,26,.16);transition:.35s;cursor:pointer}
#dots i.cur{background:var(--sky);width:30px}
#dots i.past{background:rgba(14,158,196,.45)}

#menu,#help,#notes{position:fixed;inset:0;z-index:70;background:rgba(247,244,236,.97);
  display:none;padding:clamp(20px,5vw,60px);overflow-y:auto}
#menu.on,#help.on,#notes.on{display:block;animation:fade .28s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ovh{font-family:var(--disp);font-size:22px;margin:0 0 6px}
.ovs{font-size:13px;color:var(--dim);margin:0 0 24px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mi{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;
  cursor:pointer;color:var(--ink);transition:.25s;box-shadow:var(--shadow)}
.mi:hover{border-color:var(--sky);transform:translateY(-2px)}
.mi .n{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--skyT);display:block;margin-bottom:5px}
.mi .h{font-size:14px;font-weight:500;line-height:1.35}
.mi.cur{border-color:var(--sky);background:rgba(14,158,196,.1)}
.mgroup{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.ovbox{max-width:760px;margin:0 auto}
.ovbox table{width:100%;border-collapse:collapse;font-size:14px}
.ovbox td{padding:9px 0;border-bottom:1px solid var(--line);color:var(--dim)}
.ovbox td:first-child{width:150px}
.ntext{font-size:clamp(15px,1.35vw,18px);line-height:1.65;color:#2C3038;font-weight:300;white-space:pre-wrap}
.ntime{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--goldT);border:1px solid rgba(233,168,37,.5);background:rgba(233,168,37,.12);border-radius:999px;padding:4px 10px;margin-bottom:14px}

/* ---------- пульт ---------- */
.rm{max-width:540px;margin:0 auto;padding:20px 18px 44px}
.rm .now{border:1px solid rgba(14,158,196,.4);background:#fff;border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.rm .now .n{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--skyT);margin-bottom:8px}
.rm .now .h{font-family:var(--disp);font-weight:600;font-size:22px;line-height:1.22}
.rm .nx{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;color:var(--dim);font-size:14px;background:#fff}
.rm .nx .n{font-family:var(--mono);font-size:10px;letter-spacing:.16em;margin-bottom:6px}
.rm .pad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rm .pad button{height:76px;border-radius:18px;font-family:var(--disp);font-size:15px;font-weight:600;
  letter-spacing:0;text-transform:none;padding:0;color:var(--ink)}
.rm .pad .wide{grid-column:1/-1;height:52px}
.rm .notes{margin-top:20px;border-top:1px solid var(--line);padding-top:16px;font-size:14.5px;line-height:1.62;
  color:#2C3038;font-weight:300;white-space:pre-wrap}
.rm .notes h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
.warnbox{border:1px solid rgba(233,168,37,.55);background:rgba(233,168,37,.14);border-radius:12px;padding:12px 14px;
  font-size:12.5px;line-height:1.5;color:#5A3E07;margin-bottom:16px}

@media(max-width:900px){
  .g2,.g3,.g4,.dims,.split{grid-template-columns:1fr}
  #dots{display:none}
  .slide{padding:62px 20px 92px}
  .bar{grid-template-columns:1fr;gap:5px}
  .bar .pc{text-align:left;min-width:0}
  #hud .lbl{display:none}
  .seal{display:none}
}
@media(max-width:1200px) and (min-width:901px){.g4{grid-template-columns:repeat(2,1fr)}}
body.lite #amb .blob{transition:none}
body.lite .card,body.lite .dim,body.lite .mi{box-shadow:none}
body.lite .slide-in,body.lite .slide-out{animation-duration:.2s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="amb"><div class="blob b1"></div><div class="blob b2"></div></div>
<div id="gridbg"></div>
<div id="top"><i></i></div>
<main id="deck"></main>
<div id="menu"></div>
<div id="help"></div>
<div id="notes"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
